name: Selenium TestNG Tests

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  selenium-tests:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Verify Java
        run: java -version

      - name: Build Project
        run: mvn clean compile

      - name: Run Selenium TestNG Suite
        run: mvn test

      - name: Upload Test Reports
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: TestNG-Reports
          path: |
            test-output/
            target/surefire-reports/